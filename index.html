<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friday Night Poker Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-4 max-w-xl mx-auto min-h-screen font-sans pb-12">

  <header class="mb-6 border-b border-slate-700 pb-4 flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-emerald-400">♠️ Friday Night Poker</h1>
      <p class="text-xs text-slate-400">Live ledger, debts & history</p>
    </div>
    <button onclick="clearHistory()" class="text-xs bg-rose-950 text-rose-300 hover:bg-rose-900 px-2 py-1 rounded border border-rose-800">
      Reset History
    </button>
  </header>

  <!-- Navigation Tabs -->
  <div class="flex gap-2 mb-6">
    <button id="tabActiveBtn" onclick="switchTab('active')" class="flex-1 py-2 font-bold rounded-lg bg-emerald-600 text-white">Active Game</button>
    <button id="tabLeaderboardBtn" onclick="switchTab('leaderboard')" class="flex-1 py-2 font-bold rounded-lg bg-slate-800 text-slate-400">Leaderboard</button>
  </div>

  <!-- TAB 1: ACTIVE GAME -->
  <div id="tabActive" class="space-y-6">
    <!-- Add Player Section -->
    <section class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
      <h2 class="text-sm font-semibold mb-2 text-slate-300">Add Player to Game</h2>
      <div class="flex gap-2">
        <input id="playerName" type="text" placeholder="Player Name" class="bg-slate-700 text-white px-3 py-2 rounded-lg flex-1 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
        <button onclick="addPlayer()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg font-bold text-sm">Add</button>
      </div>
    </section>

    <!-- Live Table Section -->
    <section class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
      <h2 class="text-sm font-semibold mb-3 text-slate-300">Active Game Roster</h2>
      <div id="playerList" class="space-y-3">
        <!-- Dynamic content -->
      </div>
      
      <div id="zeroSumCheck" class="mt-4 p-3 rounded-lg bg-slate-700/50 text-sm hidden"></div>

      <button onclick="calculateAndSave()" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg shadow-md transition text-sm">
        End Game, Settle & Save to History
      </button>
    </section>

    <!-- Settlement Results -->
    <section id="resultsSection" class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700 hidden">
      <h2 class="text-base font-semibold mb-3 text-emerald-400">Minimised Payments</h2>
      <div id="transactions" class="space-y-2 text-sm"></div>
    </section>
  </div>

  <!-- TAB 2: LEADERBOARD & HISTORY -->
  <div id="tabLeaderboard" class="space-y-6 hidden">
    <!-- All-Time Leaderboard -->
    <section class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
      <h2 class="text-lg font-bold mb-3 text-emerald-400">All-Time Standings</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="text-xs text-slate-400 border-b border-slate-700">
            <tr>
              <th class="pb-2">Player</th>
              <th class="pb-2 text-center">Played</th>
              <th class="pb-2 text-center">Rebuys</th>
              <th class="pb-2 text-right">Net Profit</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody" class="divide-y divide-slate-700/50">
            <!-- Dynamic Content -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- Game History Log -->
    <section class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
      <h2 class="text-sm font-semibold mb-3 text-slate-300">Past Sessions</h2>
      <div id="historyLog" class="space-y-3 text-xs">
        <!-- Dynamic Content -->
      </div>
    </section>
  </div>

  <script>
    const BUY_IN_AMOUNT = 100; // $100 or 100 BB
    let activePlayers = [];

    // --- Tab Switching ---
    function switchTab(tab) {
      if (tab === 'active') {
        document.getElementById('tabActive').classList.remove('hidden');
        document.getElementById('tabLeaderboard').classList.add('hidden');
        document.getElementById('tabActiveBtn').className = "flex-1 py-2 font-bold rounded-lg bg-emerald-600 text-white";
        document.getElementById('tabLeaderboardBtn').className = "flex-1 py-2 font-bold rounded-lg bg-slate-800 text-slate-400";
      } else {
        document.getElementById('tabActive').classList.add('hidden');
        document.getElementById('tabLeaderboard').classList.remove('hidden');
        document.getElementById('tabActiveBtn').className = "flex-1 py-2 font-bold rounded-lg bg-slate-800 text-slate-400";
        document.getElementById('tabLeaderboardBtn').className = "flex-1 py-2 font-bold rounded-lg bg-emerald-600 text-white";
        renderLeaderboard();
      }
    }

    // --- Active Game Logic ---
    function addPlayer() {
      const nameInput = document.getElementById('playerName');
      const name = nameInput.value.trim();
      if (!name) return;

      activePlayers.push({
        id: Date.now(),
        name: name,
        reloads: 0,
        finalChips: 0
      });

      nameInput.value = '';
      renderActiveTable();
    }

    function updateReloads(id, delta) {
      const p = activePlayers.find(x => x.id === id);
      if (p) {
        p.reloads = Math.max(0, p.reloads + delta);
        renderActiveTable();
      }
    }

    function updateChips(id, val) {
      const p = activePlayers.find(x => x.id === id);
      if (p) p.finalChips = parseFloat(val) || 0;
      validateZeroSum();
    }

    function validateZeroSum() {
      const totalIn = activePlayers.reduce((sum, p) => sum + BUY_IN_AMOUNT + (p.reloads * BUY_IN_AMOUNT), 0);
      const totalOut = activePlayers.reduce((sum, p) => sum + p.finalChips, 0);
      const diff = totalOut - totalIn;

      const checkDiv = document.getElementById('zeroSumCheck');
      checkDiv.classList.remove('hidden');

      if (diff === 0 && activePlayers.length > 0) {
        checkDiv.className = "mt-4 p-3 rounded-lg bg-emerald-950/50 text-emerald-400 text-xs border border-emerald-800";
        checkDiv.innerText = "✓ Chips match total buy-ins ($" + totalIn + ")";
      } else if (activePlayers.length > 0) {
        checkDiv.className = "mt-4 p-3 rounded-lg bg-rose-950/50 text-rose-400 text-xs border border-rose-800";
        checkDiv.innerText = `⚠️ Discrepancy: ${diff > 0 ? '+' : ''}${diff} chips unaccounted for.`;
      } else {
        checkDiv.classList.add('hidden');
      }
    }

    // --- Settlement & localStorage Handling ---
    function calculateAndSave() {
      if (activePlayers.length === 0) return;

      // 1. Calculate Net Positions
      let balances = activePlayers.map(p => {
        const invested = BUY_IN_AMOUNT + (p.reloads * BUY_IN_AMOUNT);
        return { name: p.name, net: p.finalChips - invested, invested, reloads: p.reloads, chips: p.finalChips };
      });

      // 2. Debt Minimization
      let debtors = balances.filter(b => b.net < 0).map(b => ({ name: b.name, net: -b.net }));
      let creditors = balances.filter(b => b.net > 0).map(b => ({ name: b.name, net: b.net }));

      let transactions = [];
      let i = 0, j = 0;

      while (i < debtors.length && j < creditors.length) {
        let amount = Math.min(debtors[i].net, creditors[j].net);
        transactions.push(`${debtors[i].name} pays ${creditors[j].name} $${amount.toFixed(2)}`);

        debtors[i].net -= amount;
        creditors[j].net -= amount;

        if (debtors[i].net === 0) i++;
        if (creditors[j].net === 0) j++;
      }

      // Display Settlement
      const txContainer = document.getElementById('transactions');
      txContainer.innerHTML = transactions.length 
        ? transactions.map(t => `<div class="p-2 bg-slate-700 rounded border border-slate-600">${t}</div>`).join('')
        : '<div class="text-slate-400">Everyone broke even!</div>';

      document.getElementById('resultsSection').classList.remove('hidden');

      // 3. Persist to localStorage
      const sessionData = {
        id: Date.now(),
        date: new Date().toLocaleDateString(),
        players: balances,
        transactions: transactions
      };

      const history = JSON.parse(localStorage.getItem('poker_history') || '[]');
      history.unshift(sessionData); // Add to top of history
      localStorage.setItem('poker_history', JSON.stringify(history));
    }

    // --- Leaderboard & History Aggregation ---
    function renderLeaderboard() {
      const history = JSON.parse(localStorage.getItem('poker_history') || '[]');
      const stats = {};

      // Aggregate past sessions
      history.forEach(session => {
        session.players.forEach(p => {
          if (!stats[p.name]) {
            stats[p.name] = { games: 0, reloads: 0, net: 0 };
          }
          stats[p.name].games += 1;
          stats[p.name].reloads += p.reloads;
          stats[p.name].net += p.net;
        });
      });

      // Sort players by total net profit (descending)
      const sorted = Object.keys(stats).map(name => ({ name, ...stats[name] }))
        .sort((a, b) => b.net - a.net);

      // Render Leaderboard
      const lbBody = document.getElementById('leaderboardBody');
      lbBody.innerHTML = sorted.length ? sorted.map(s => `
        <tr class="py-2">
          <td class="py-2 font-bold text-slate-200">${s.name}</td>
          <td class="py-2 text-center text-slate-400">${s.games}</td>
          <td class="py-2 text-center text-slate-400">${s.reloads}</td>
          <td class="py-2 text-right font-mono font-bold ${s.net >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
            ${s.net >= 0 ? '+' : ''}$${s.net}
          </td>
        </tr>
      `).join('') : `<tr><td colspan="4" class="py-4 text-center text-slate-500">No past games recorded yet.</td></tr>`;

      // Render Session Logs
      const historyLog = document.getElementById('historyLog');
      historyLog.innerHTML = history.length ? history.map(s => `
        <div class="bg-slate-700/40 p-3 rounded-lg border border-slate-700 space-y-1">
          <div class="flex justify-between font-bold text-slate-300 mb-1">
            <span>📅 ${s.date}</span>
            <span>${s.players.length} Players</span>
          </div>
          <div class="text-slate-400">
            ${s.players.map(p => `${p.name}: <span class="${p.net >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${p.net >= 0 ? '+' : ''}$${p.net}</span>`).join(' • ')}
          </div>
        </div>
      `).join('') : `<div class="text-slate-500">History is empty.</div>`;
    }

    function clearHistory() {
      if (confirm("Are you sure you want to delete all historical games and reset the leaderboard?")) {
        localStorage.removeItem('poker_history');
        renderLeaderboard();
      }
    }

    // --- Render Active Roster ---
    function renderActiveTable() {
      const container = document.getElementById('playerList');
      container.innerHTML = activePlayers.map(p => `
        <div class="bg-slate-700/50 p-3 rounded-lg border border-slate-600 flex flex-col gap-2">
          <div class="flex justify-between items-center">
            <span class="font-bold text-emerald-300 text-sm">${p.name}</span>
            <span class="text-xs bg-slate-800 px-2 py-1 rounded text-slate-300">In: $${BUY_IN_AMOUNT + (p.reloads * BUY_IN_AMOUNT)}</span>
          </div>
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-1">
              <span class="text-xs text-slate-400">Reloads:</span>
              <button onclick="updateReloads(${p.id}, -1)" class="w-6 h-6 bg-slate-600 rounded font-bold text-sm">-</button>
              <span class="px-2 font-mono text-sm">${p.reloads}</span>
              <button onclick="updateReloads(${p.id}, 1)" class="w-6 h-6 bg-slate-600 rounded font-bold text-sm">+</button>
            </div>
            <div class="flex items-center gap-1">
              <span class="text-xs text-slate-400">Chips Left:</span>
              <input type="number" value="${p.finalChips}" onchange="updateChips(${p.id}, this.value)" class="w-20 bg-slate-800 text-right px-2 py-1 rounded border border-slate-600 text-sm">
            </div>
          </div>
        </div>
      `).join('');

      validateZeroSum();
    }
  </script>
</body>
</html>
